<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
     <script  src="https://unpkg.com/@tailwindcss/browser@4"></script>

</head>



<body class ="bg-purple-200">



<header class ="bg-purple-300 p-5 mb-4 rounded flex items-center justify-between">
    <div class ="flex items-center">
        <h1 class=" text-xl font-bold text-purple-700">CineTrack</h1>
    </div>
    
  <a href ="index.html" class ="bg-purple-700 text-white px-4 py-2 rounded font-bold">Admin</a>  


    
</header>


<main>

    <!--loading text li rayban  -->

    <div id ="loading" class ="hidden p-4 font-bold text-purple-700"></div>
 
    <!-- suuces wla erroe -->

    <div id ="messageLirayban" class="hidden"></div>







    <div class ="grid grid-cols-2 gap-4">

<form id ="filmForm" class ="bg-purple-100 p-4 rounded mb-4 flex flex-col gap-2">
    <h2 id ="formTitle" class="text-lg font-bold">Ajouter un titre</h2>
    <input id="title" type="text" placeholder="Titre" class="p-2 rounded bg-white">

    <p id ="error-title" class ="text-red-600 text-sm"></p>
    <select id ="type" class ="p-2 rounded bg-white">
        <option value ="">Choisir le type</option>
        <option value ="movie">Film</option>
        <option value ="series">Series</option>
    </select>

<p id="error-type" class="text-red-600 text-sm"></p>

<input id="releaseYear" type="number" placeholder="Annee" class="p-2 rounded bg-white">
<p id ="error-releaseYear" class ="text-red-600 text-sm"></p>

<input id="image" type="text" placeholder="URL de l'image" class="p-2 rounded bg-white">
  <p id="error-image" class="text-red-600 text-sm"></p>


   <input id="duration" type="number" placeholder="Durée en minutes (film)" class="p-2 rounded bg-white disabled:opacity-50 disabled:cursor-not-allowed">
      <p id="error-duration" class="text-red-600 text-sm"></p>



    <input id="seasons" type="number" placeholder="Nombre de saisons (série)" class="p-2 rounded bg-white disabled:opacity-50 disabled:cursor-not-allowed">
  <p id="error-seasons" class="text-red-600 text-sm"></p>


<input id ="genres" type ="text" placeholder="Genres separes par des virgules" class ="p-2 rounded bg-white">

<input id ="directors" type ="text" placeholder="Realisateurs separes par des virgules" class ="p-2 rounded bg-white">

<input id ="productionCountries" type ="text" placeholder="pays separes par des virgules" class ="p-2 rounded bg-white">
<textarea id ="description" placeholder="description" class="p-2 rounded bg-white"></textarea>

<!-- lesbutona  submit and  butona cancel -->
<div class="flex gap-2">
    <button type="submit" id ="submitBotona" class ="bg-purple-700 text-white px-4 py-2 rounded font-bold">Ajouter</button>
    <button type ="button" id="cancelBotona" class ="hidden bg-blue-500 text-white px-4 py-2 rounded font-bold">Annuler</button>
</div>

</form>





    <!-- titles list limn -->
<div>

     <div class ="grid grid-cols-5 gap-2 bg-purple-400 text-white rounded p-2 font-bold text-center">
        <div>Image</div>
        <div>Titre</div>
        <div>Type</div>
        <div>Annee</div>
        <div>Actions</div>
     </div>

    <div id ="tableBody" class="flex flex-col gap-2 mt-2"></div>
    </div>
</div>
</main>





<script type="module" src="./js/admin.js"></script>

    
</body>
</html>
